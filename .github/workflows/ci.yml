name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check ES5 and manifests
        run: npm run check
      - name: Build the webOS package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: livetv-plus-ipk
          path: dist/*.ipk
